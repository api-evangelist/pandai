aid: pandai
name: Pandai
description: >-
  Pandai is a Malaysian education technology company founded in 2020 that operates
  a digital learning platform for primary and secondary school students. The app
  aligns to Malaysia's national curriculum (DSKP) across KSSR Years 1-6 and KSSM
  Forms 1-5, including SPM exam preparation, and helps learners improve their grades
  through interactive quizzes, tests, exams, topical practice, notes, flashcards,
  videos, and live tutoring. Features include personalized assessments, an AI-powered
  revision assistant (Ask Pbot), gamified learning with battles, leaderboards and
  rewards, and performance tracking via scorecards and report cards. Pandai is a
  consumer-facing learning app and does not publish a public developer API surface;
  this profile was surfaced as a 500 Global portfolio company and enriched by the
  API Evangelist pipeline.
